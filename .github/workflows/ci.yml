name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q
      - name: python -m eyalsec answers
        run: python -m eyalsec --version

  other-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.0 mypy==2.4.0 'httpx>=0.25,<1'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: The sync client is generated from the async one
        run: python scripts/unasync.py --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r docs/requirements.txt -e .
      - run: mkdocs build --strict

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      # Build from a copy outside the git checkout, as a release is built:
      # inside one, hatchling also ships the repository's .gitignore.
      - name: Build
        run: |
          pkg="$RUNNER_TEMP/pkg"
          mkdir -p "$pkg"
          cp -r pyproject.toml README.md LICENSE src "$pkg/"
          python -m build -o dist "$pkg"
      - run: python -m twine check --strict dist/*
      - name: The sdist holds only the package, README, LICENSE and pyproject
        run: |
          tar tzf dist/*.tar.gz | sed 's#^[^/]*/##' | sort
          ! tar tzf dist/*.tar.gz | sed 's#^[^/]*/##' | grep -vxE '|LICENSE|README.md|pyproject.toml|PKG-INFO|src/|src/eyalsec/|src/eyalsec/[a-z_]+\.py|src/eyalsec/py\.typed'
